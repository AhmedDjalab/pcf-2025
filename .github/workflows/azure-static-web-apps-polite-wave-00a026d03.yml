name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 4dBim
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 4dBim

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build CRA app
      - name: Build
        run: npm run build

      # Deploy to Azure Static Web Apps
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_WAVE_00A026D03 }}
          action: "upload"
          app_location: "/"     # where your CRA source code lives
          api_location: ""      # if you have an API (optional)
          output_location: "build" # CRA build output folder

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
