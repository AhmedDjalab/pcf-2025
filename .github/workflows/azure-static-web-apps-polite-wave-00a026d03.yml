name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 4dBim
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 4dBim

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v3

      # Setup Node.js (CRA works well with Node 18)
      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build CRA app
      - name: Build app
        run: npm run build

      # Deploy to Azure Static Web Apps
      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_WAVE_00A026D03 }}
          action: "upload"
          app_location: "/"        # CRA is in repo root
          api_location: ""         # no API for CRA
          output_location: "build" # CRA build output folder

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
